[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12.7"
dependencies = [
    "fastapi>=0.139.0",
    "flagembedding>=1.4.0",
    "grandalf>=0.8",
    "langchain>=1.3.11",
    "langchain-community>=0.4.2",
    "langchain-core>=1.4.8",
    "langchain-openai>=1.3.3",
    "langgraph>=1.2.8",
    "loguru>=0.7.3",
    "magic-pdf>=1.3.12",
    "minio>=7.2.20",
    "modelscope>=1.38.1",
    "numpy>=2.5.1",
    "pandas>=3.0.3",
    "pymilvus[model]>=3.0.0",
    "pymilvus-model>=0.3.2",
    "pymongo>=4.17.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "regex>=2026.6.28",
    "torch>=2.12.1",
    "torchaudio>=2.11.0",
    "torchvision>=0.27.1",
    "uvicorn[standard]>=0.50.2",
    "transformers>=4.57.6",
    "grpcio>=1.63.1,!=1.82.0,<2",
    "protobuf>=7.0,<8",
    "charset-normalizer>=3.4.9",
    "starlette>=1.3.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
namespaces = true
